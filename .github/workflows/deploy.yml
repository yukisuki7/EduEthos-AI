name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy-production
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out the tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check that this is still the latest main commit
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$remote_sha" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; that run will deploy instead.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy and verify the application
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing production deployment secrets}"
          : "${DEPLOY_USER:?Missing production deployment user}"
          : "${DEPLOY_SSH_KEY:?Missing production deployment key}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing pinned SSH host keys}"
          key_file="$RUNNER_TEMP/eduethos-deploy-key"
          hosts_file="$RUNNER_TEMP/eduethos-known-hosts"
          archive_file="$RUNNER_TEMP/eduethos-release.tar.gz"
          trap 'rm -f "$key_file" "$hosts_file" "$archive_file"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          git archive --format=tar.gz -o "$archive_file" "$GITHUB_SHA" course-demo/dist course-demo/server course-demo/worker
          archive_size=$(stat -c '%s' "$archive_file")
          {
            printf '{"commit":"%s","archiveBytes":%s}\n' "$GITHUB_SHA" "$archive_size"
            cat "$archive_file"
          } | ssh -T -i "$key_file" -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$hosts_file" -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=6 \
            "$DEPLOY_USER@$DEPLOY_HOST" deploy
          printf 'Deployed commit `%s`; server health check passed.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
